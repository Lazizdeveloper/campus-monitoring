[project]
name = "campus-monitoring"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Laziz Shakarov", email = "shakarovlaziz243@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp>=3.14.3",
    "apscheduler>=3.11.3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
campus-monitoring = "campus_monitoring:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
